; Moisture sensor — ESP32-C3
; Build local: pio run -e esp32c3_local
; Build prod:  pio run -e esp32c3_prod
; Flash:       pio run -e esp32c3_local -t upload
; Monitor:     pio device monitor

[platformio]
default_envs = esp32c3_local

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
	-I${PROJECT_DIR}/include
	-DBOARD_ESP32C3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_local]
build_flags =
	${env.build_flags}
	-DINGEST_ENV_LOCAL

[env:esp32c3_prod]
build_flags =
	${env.build_flags}
	-DINGEST_ENV_PROD
